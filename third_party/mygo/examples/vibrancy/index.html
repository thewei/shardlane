<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vibrancy</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      --titlebar: 52px;        /* the height of an inset title bar */
      /* The room of the window controls over the page, 0 in full screen. */
      --controls-left: var(--mygo-titlebar-inset-left, 0px);
      --controls-right: var(--mygo-titlebar-inset-right, 0px);
      --sidebar: 220px;
      --label: light-dark(rgb(0 0 0 / 85%), rgb(255 255 255 / 85%));
      --secondary: light-dark(rgb(0 0 0 / 50%), rgb(255 255 255 / 55%));
      --tertiary: light-dark(rgb(0 0 0 / 30%), rgb(255 255 255 / 30%));
      --fill: light-dark(rgb(0 0 0 / 8%), rgb(255 255 255 / 10%));
      --separator: light-dark(rgb(0 0 0 / 10%), rgb(255 255 255 / 12%));
      --content: light-dark(#fff, #1e1e1e);
      --accent: light-dark(#007aff, #0a84ff);
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      overflow: hidden;
      color: var(--label);
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; }
    svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }

    /* The title bar is hidden: these headers drag the window. */
    .titlebar { --app-region: drag; flex: none; height: var(--titlebar); display: flex; align-items: center; }

    /* No background: the window's material shows through. */
    aside {
      flex: none; box-sizing: border-box; width: var(--sidebar);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--separator);
      transition: margin-left 0.25s ease;
    }
    .collapsed aside { margin-left: calc(-1 * var(--sidebar)); }
    nav { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
    nav h2 { margin: 14px 8px 4px; font-size: 11px; font-weight: 600; color: var(--tertiary); }
    nav h2:first-child { margin-top: 2px; }
    nav button {
      display: flex; align-items: center; gap: 7px;
      width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; text-align: left;
    }
    nav button svg { color: var(--accent); }
    nav button[aria-current] { background: var(--fill); }

    /* Next to the window controls on the left, whether the sidebar is shown or not. */
    #toggle {
      position: fixed; top: calc((var(--titlebar) - 28px) / 2); left: calc(var(--controls-left) + 8px);
      display: grid; place-items: center; width: 32px; height: 28px; border-radius: 6px;
      color: var(--secondary); transition: left 0.25s ease;
    }
    #toggle:hover { background: var(--fill); }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--content); }
    .see-through main { background: none; }
    main .titlebar { padding: 0 calc(var(--controls-right) + 20px) 0 20px; border-bottom: 1px solid var(--separator); transition: padding-left 0.25s ease; }
    .collapsed main .titlebar { padding-left: calc(var(--controls-left) + 56px); }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    article { flex: 1; overflow-y: auto; padding: 24px 28px; max-width: 560px; }
    article p { margin: 0 0 16px; }
    #about { font-size: 15px; }
    pre {
      margin: 0 0 24px; padding: 12px 14px; border-radius: 8px; background: var(--fill);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-user-select: text; user-select: text;
    }
    label { display: flex; align-items: center; gap: 6px; }
    .note { margin-top: 24px; font-size: 12px; color: var(--secondary); }
  </style>
</head>
<body>
  <svg style="display: none">
    <symbol id="window" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M1.5 5.5h13"/></symbol>
    <symbol id="transient" viewBox="0 0 16 16"><path d="M3 2.5h10A1.5 1.5 0 0 1 14.5 4v6a1.5 1.5 0 0 1-1.5 1.5H7.5L4.5 14v-2.5H3A1.5 1.5 0 0 1 1.5 10V4A1.5 1.5 0 0 1 3 2.5z"/></symbol>
    <symbol id="backdrop" viewBox="0 0 16 16"><path d="M8 1.5l1.7 4.8 4.8 1.7-4.8 1.7L8 14.5l-1.7-4.8L1.5 8l4.8-1.7z"/></symbol>
    <symbol id="sidebar" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></symbol>
  </svg>

  <aside>
    <header class="titlebar"></header>
    <nav>
      <h2>Window areas</h2>
      <button data-vibrancy="sidebar" data-constant="VibrancySidebar" title="The background of sidebars, like this one."><svg><use href="#window"/></svg>Sidebar</button>
      <button data-vibrancy="titlebar" data-constant="VibrancyTitlebar" title="The background of title bars and toolbars."><svg><use href="#window"/></svg>Title bar</button>
      <button data-vibrancy="header" data-constant="VibrancyHeader" title="Headers and footers inside content."><svg><use href="#window"/></svg>Header</button>
      <button data-vibrancy="window" data-constant="VibrancyWindow" title="The background of opaque windows."><svg><use href="#window"/></svg>Window</button>
      <button data-vibrancy="content" data-constant="VibrancyContent" title="The background of opaque content."><svg><use href="#window"/></svg>Content</button>
      <button data-vibrancy="under-window" data-constant="VibrancyUnderWindow" title="What shows under the background of a window."><svg><use href="#window"/></svg>Under window</button>
      <button data-vibrancy="under-page" data-constant="VibrancyUnderPage" title="The area behind the pages of a document."><svg><use href="#window"/></svg>Under page</button>
      <h2>Transient UI</h2>
      <button data-vibrancy="menu" data-constant="VibrancyMenu" title="The background of menus."><svg><use href="#transient"/></svg>Menu</button>
      <button data-vibrancy="popover" data-constant="VibrancyPopover" title="The background of popovers."><svg><use href="#transient"/></svg>Popover</button>
      <button data-vibrancy="hud" data-constant="VibrancyHUD" title="The background of heads-up displays."><svg><use href="#transient"/></svg>HUD</button>
      <button data-vibrancy="sheet" data-constant="VibrancySheet" title="The background of sheets."><svg><use href="#transient"/></svg>Sheet</button>
      <button data-vibrancy="tooltip" data-constant="VibrancyTooltip" title="The background of tooltips."><svg><use href="#transient"/></svg>Tooltip</button>
      <button data-vibrancy="selection" data-constant="VibrancySelection" title="The highlight of selected content."><svg><use href="#transient"/></svg>Selection</button>
      <button data-vibrancy="fullscreen-ui" data-constant="VibrancyFullScreenUI" title="The background of full screen modal interfaces."><svg><use href="#transient"/></svg>Full screen UI</button>
      <h2>Windows 11</h2>
      <button data-vibrancy="mica" data-constant="VibrancyMica" title="Tints the window with the desktop wallpaper. Under window on macOS."><svg><use href="#backdrop"/></svg>Mica</button>
      <button data-vibrancy="acrylic" data-constant="VibrancyAcrylic" title="Blurs what is behind the window. HUD on macOS."><svg><use href="#backdrop"/></svg>Acrylic</button>
      <button data-vibrancy="tabbed" data-constant="VibrancyTabbed" title="Mica for windows with tabs in the title bar. Under window on macOS."><svg><use href="#backdrop"/></svg>Tabbed</button>
    </nav>
  </aside>
  <button id="toggle" title="Hide Sidebar"><svg><use href="#sidebar"/></svg></button>

  <main>
    <header class="titlebar"><h1 id="name"></h1></header>
    <article>
      <p id="about"></p>
      <pre id="code"></pre>
      <p>A material shows wherever the page is transparent: the sidebar has no background, this pane has one.</p>
      <label><input type="checkbox" id="see-through"> Show the material behind this pane too</label>
      <p class="note">Windows 11 shows the closest of its backdrops: Acrylic for transient UI, Mica otherwise. Linux has no materials.</p>
    </article>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const nav = document.querySelector("nav");
    function select(item) {
      nav.querySelector("[aria-current]")?.removeAttribute("aria-current");
      item.setAttribute("aria-current", "true");
      $("name").textContent = item.textContent;
      $("about").textContent = item.title;
      $("code").textContent = "win.SetVibrancy(mygo." + item.dataset.constant + ")";
    }
    nav.addEventListener("click", (e) => {
      const item = e.target.closest("button");
      if (item) {
        mygo.call("Vibrancy.Set", item.dataset.vibrancy);
        select(item);
      }
    });
    select(nav.querySelector("button")); // the window starts with VibrancySidebar

    $("toggle").onclick = () => {
      const collapsed = document.body.classList.toggle("collapsed");
      $("toggle").title = collapsed ? "Show Sidebar" : "Hide Sidebar";
    };
    $("see-through").onchange = (e) => document.body.classList.toggle("see-through", e.target.checked);
  </script>
</body>
</html>
