[package]
name = "shardlane-host"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-only"
description = "UI-independent Shardlane host contracts and application-service boundaries"

[dependencies]
async-channel = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shardlane-history = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Named-pipe client transport for the Herdr Windows local socket
# (crates/shardlane-host/src/local_socket.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
filetime = "0.2"
libc = "0.2"
tempfile = { workspace = true }
