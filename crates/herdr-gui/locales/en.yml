# Shardlane native-shell English catalog (rust-i18n format 1: the locale is
# the file stem and nested keys flatten to dot keys). `en` is the fallback
# locale: keys missing from any other locale resolve here.
#
# Migration policy: every key lands in ALL sibling locale files (en, zh-CN,
# zh-TW, ja, ko) in the same change — the i18n catalog parity test enforces
# identical key sets. New UI strings must use `crate::i18n::t()` /
# `t_with()` so a locale only ever needs its existing sibling file.
