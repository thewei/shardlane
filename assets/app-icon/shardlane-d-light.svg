<?xml version="1.0" encoding="UTF-8"?>
<!--
 * [INPUT]: the Option-D portal / path / destination triptych composition;
 * light-theme palette
 * [OUTPUT]: the Shardlane Option-D light-theme SVG icon, embeddable standalone
 * in the app
 * [POS]: the themed brand asset of assets/app-icon; does not change the
 * existing cargo-bundle PNG inputs
 * [PROTOCOL]: Update this header on change, then check CLAUDE.md.
 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shardlane D — light</title>
  <desc id="desc">A rounded portal frame, a forward looped route, and an amber destination diamond on a pale blue background.</desc>

  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.58" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#d5e4ff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#7189f4"/>
      <stop offset="0.52" stop-color="#4e66db"/>
      <stop offset="1" stop-color="#2d429f"/>
    </linearGradient>
    <linearGradient id="route" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#0dbfb9"/>
      <stop offset="0.48" stop-color="#149dd7"/>
      <stop offset="1" stop-color="#315fd4"/>
    </linearGradient>
    <linearGradient id="beacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#ffd968"/>
      <stop offset="0.48" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#eb8415"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="176" fill="url(#background)"/>

  <!-- Open portal frame: the right-side gap is intentional, giving the
       path an "exit" semantics. -->
  <path
    d="M 820 424 V 326 C 820 251 759 190 684 190 H 340 C 258 190 192 256 192 338 V 684 C 192 766 258 832 340 832 H 650"
    fill="none"
    stroke="url(#frame)"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 807 413 V 326 C 807 258 753 204 684 204 H 340 C 266 204 206 264 206 338 V 684 C 206 758 266 818 340 818 H 646"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.54"
  />

  <!-- Closed outlines extracted from the Option-D reference bitmap; only
       the theme color changes, no more guessed centerline strokes. -->
  <path
    d="M 319.7,695.3 Q 327.5,688.4 385.4,648.4 Q 443.4,608.4 446.7,601.8 Q 449.9,595.3 449.1,590.0 Q 448.3,584.7 445.0,580.2 Q 441.8,575.7 400.1,551.2 Q 358.5,526.7 347.9,518.1 Q 337.3,509.6 329.5,499.3 Q 321.7,489.1 318.5,482.6 Q 315.2,476.1 310.7,461.0 Q 306.2,445.9 305.4,430.7 Q 304.6,415.6 306.2,403.8 Q 307.9,392.0 311.5,380.5 Q 315.2,369.1 320.5,358.9 Q 325.8,348.7 333.2,338.9 Q 340.5,329.1 348.3,321.7 Q 356.0,314.4 367.1,307.0 Q 378.1,299.7 391.1,294.4 Q 404.2,289.1 419.7,286.2 Q 435.2,283.4 449.5,283.8 Q 463.8,284.2 475.3,286.6 Q 486.7,289.1 500.6,294.8 Q 514.4,300.5 644.3,383.0 Q 774.1,465.5 787.6,479.3 Q 801.1,493.2 807.2,503.4 Q 813.3,513.6 817.0,523.0 Q 820.7,532.4 823.5,545.9 Q 826.4,559.4 826.4,573.7 Q 826.4,587.9 823.9,600.2 Q 821.5,612.4 813.3,630.4 Q 805.2,648.4 792.9,663.1 Q 780.7,677.8 681.9,750.9 Q 583.0,823.9 574.5,828.0 Q 565.9,832.1 555.3,834.6 Q 544.7,837.0 520.6,837.0 Q 496.5,837.0 490.4,833.7 Q 484.2,830.5 479.7,823.9 Q 475.3,817.4 474.8,808.8 Q 474.4,800.3 478.1,792.9 Q 481.8,785.6 550.4,732.9 Q 619.0,680.2 665.5,646.7 Q 712.1,613.3 717.8,607.1 Q 723.5,601.0 725.9,596.1 Q 728.4,591.2 730.0,583.9 Q 731.7,576.5 731.3,571.2 Q 730.8,565.9 727.2,556.1 Q 723.5,546.3 717.0,539.8 Q 710.4,533.2 587.5,460.1 Q 464.6,387.1 456.5,384.6 Q 448.3,382.2 439.7,383.0 Q 431.2,383.8 422.6,388.7 Q 414.0,393.6 408.3,401.8 Q 402.6,409.9 401.4,414.4 Q 400.1,418.9 401.4,431.2 Q 402.6,443.4 405.4,448.7 Q 408.3,454.0 413.2,458.9 Q 418.1,463.8 472.0,498.5 Q 525.9,533.2 531.6,538.9 Q 537.3,544.7 543.0,554.9 Q 548.7,565.1 550.8,573.7 Q 552.8,582.2 552.8,593.7 Q 552.8,605.1 550.4,615.3 Q 547.9,625.5 543.0,634.9 Q 538.1,644.3 530.4,652.9 Q 522.6,661.4 449.9,714.1 Q 377.3,766.8 369.9,770.4 Q 362.6,774.1 351.9,774.9 Q 341.3,775.8 334.8,773.7 Q 328.3,771.7 320.9,766.0 Q 313.6,760.2 310.3,754.9 Q 307.0,749.6 305.4,743.9 Q 303.8,738.2 304.2,728.0 Q 304.6,717.8 308.3,710.0 Q 311.9,702.3 319.7,695.3 Z"
    fill="url(#route)"
    fill-rule="nonzero"
  />

  <!-- Warm destination hint. -->
  <path d="M 668 500 L 715 547 L 668 594 L 621 547 Z" fill="url(#beacon)"/>
  <path d="M 668 512 L 703 547 L 668 582 L 633 547 Z" fill="#fff8ce" opacity="0.26"/>
</svg>
