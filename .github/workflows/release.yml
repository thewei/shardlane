name: release

# Release pipeline: two macOS build jobs produce per-arch ad-hoc-signed app
# archives + SHA-256 pairs, then one publish job assembles the GitHub release
# and the backward-compatible latest.json. Releases ship macOS-only; the
# linux/windows jobs are defined but disabled: the vendored per-target
# archives are committed and ABI-gated, shardlane-history and gpui-symbols
# portability splits have landed, but the rest of the workspace (herdr-gui
# and the GPUI backends) is not yet validated on native linux/windows
# runners — port and validate there before flipping the two `if` lines.
#
# [PROTOCOL]: Update .github/CLAUDE.md on change, then check /CLAUDE.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-aarch64:
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install macOS bundler
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Build, sign, and verify release app bundle
        run: scripts/package-macos.sh --release --target "$TARGET"

      - name: Verify app bundle
        run: |
          APP="target/$TARGET/release/bundle/osx/Shardlane.app"
          test -d "$APP/Contents/MacOS"
          test -x "$APP/Contents/MacOS/shardlane"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/shardlane")"
          [[ "$ARCHS" == "arm64" ]] || exit 1
          while IFS= read -r -d '' member; do
            if [[ "$(file -b "$member")" == *Mach-O* ]]; then
              MEMBER_ARCHS="$(lipo -archs "$member")"
              [[ "$MEMBER_ARCHS" == "arm64" ]] || exit 1
            fi
          done < <(find "$APP" -type f -print0)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dev.shardlane.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = "Shardlane.icns"
          test -f "$APP/Contents/Resources/Shardlane.icns"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create ad-hoc ZIP and SHA-256 checksum
        run: |
          APP="target/$TARGET/release/bundle/osx/Shardlane.app"
          scripts/archive-macos.sh \
            --app "$APP" \
            --output-dir dist \
            --architecture aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-aarch64
          path: dist/*
          if-no-files-found: error

  macos-x86_64:
    runs-on: macos-15
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Configure macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install macOS bundler
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Build, sign, and verify release app bundle
        run: scripts/package-macos.sh --release --target "$TARGET"

      - name: Verify app bundle
        run: |
          APP="target/$TARGET/release/bundle/osx/Shardlane.app"
          test -d "$APP/Contents/MacOS"
          test -x "$APP/Contents/MacOS/shardlane"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/shardlane")"
          [[ "$ARCHS" == "x86_64" ]] || exit 1
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create ad-hoc ZIP and SHA-256 checksum
        run: |
          APP="target/$TARGET/release/bundle/osx/Shardlane.app"
          scripts/archive-macos.sh \
            --app "$APP" \
            --output-dir dist \
            --architecture x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x86_64
          path: dist/*
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-24.04
    # Disabled for v0.1.17: shardlane-history's unix-only file permission
    # APIs are now split, but the rest of the workspace is unvalidated on
    # native linux runners. Re-enable together with the windows job.
    if: ${{ false }}
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install link-time runtime headers
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET" --bin shardlane

      - name: Package tar.gz + SHA-256
        run: scripts/package-linux.sh --target "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-2025
    # Disabled for v0.1.17: shardlane-history's split has landed, but the
    # rest of the workspace is unvalidated on native windows runners. Its
    # live-herdr named-pipe socket verification (the merge gate) runs again
    # once the job returns.
    if: ${{ false }}
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --locked --release --target $env:TARGET --bin shardlane

      - name: Verify client socket discovery against live herdr (merge gate)
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          herdr --version
          # Start the default server; herdr binds its named pipe on boot.
          $server = Start-Process -FilePath "herdr" -ArgumentList "server" -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $expected = '\\.\pipe\herdr\herdr.sock'
            $found = $null
            while ((Get-Date) -lt $deadline -and -not $found) {
              $pipes = [System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -like '*herdr*' }
              $found = $pipes | Select-Object -First 1
              if (-not $found) { Start-Sleep -Milliseconds 300 }
            }
            if (-not $found) { Write-Host "::error::live herdr did not bind a named pipe within 30s"; exit 1 }
            Write-Host "live herdr pipe: $found"
            if ($found -ne $expected) {
              Write-Host "::error::pipe convention drifted: client expects $expected, live herdr binds $found"
              exit 1
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Run herdr client-side unit tests
        run: "cargo test --locked -p shardlane-host --lib herdr:: --target $env:TARGET"

      - name: Package zip + SHA-256
        shell: pwsh
        run: scripts/package-windows.ps1 -Target $env:TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [macos-aarch64, macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ ';'
          ls -la dist/

      - name: Publish GitHub release with multi-platform manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          NOTES_URL="https://github.com/$REPO/releases/tag/$TAG"
          permalink() { printf 'https://github.com/%s/releases/download/%s/%s' "$REPO" "$TAG" "$1"; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes \
              --notes "macOS archives are ad-hoc signed (not notarized): verify the SHA-256 file and approve the first launch. This release ships macOS only; Linux and Windows packages return in a future release."
          fi
          gh release upload "$TAG" dist/* --clobber
          jq -n \
            --arg version "$VERSION" \
            --arg arm64 "$(permalink Shardlane-macos-aarch64.zip)" \
            --arg x64 "$(permalink Shardlane-macos-x86_64.zip)" \
            --arg notes_url "$NOTES_URL" \
            '{version: $version, url: $arm64, notes_url: $notes_url, platforms: {"darwin-arm64": {archive: "Shardlane-macos-aarch64.zip", sha256: "Shardlane-macos-aarch64.zip.sha256", url: $arm64}, "darwin-x86_64": {archive: "Shardlane-macos-x86_64.zip", sha256: "Shardlane-macos-x86_64.zip.sha256", url: $x64}}}' > latest.json
          python3 -m json.tool latest.json > /dev/null
          gh release upload "$TAG" latest.json --clobber
